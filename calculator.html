<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css" />
    <script defer src="calculator-engine.js"></script>
    <script defer src="calculator-app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator" data-role="calculator" aria-label="Calculator">
        <section class="calculator__top">
          <header class="brand">
            <div>
              <h1>Calculator</h1>
              <p>Keyboard ready • Press A for circle area</p>
            </div>
            <div
              class="memory-indicator"
              id="memory-indicator"
              data-role="memory-indicator"
              aria-hidden="true"
            >
              M
            </div>
          </header>

          <section class="display-panel">
            <output class="history" id="history" data-role="history">&nbsp;</output>
            <output
              class="result"
              id="result"
              data-role="result"
              aria-live="polite"
              aria-atomic="true"
            >
              0
            </output>
          </section>
        </section>

        <section class="calculator__controls">
          <section
            class="memory-keys"
            data-role="memory-section"
            aria-label="Calculator memory keys"
          >
            <button class="memory-button operator" data-action="memory-clear">
              MC
            </button>
            <button class="memory-button operator" data-action="memory-recall">
              MR
            </button>
            <button class="memory-button operator" data-action="memory-add">
              M+
            </button>
            <button
              class="memory-button operator"
              data-action="memory-subtract"
            >
              M-
            </button>
            <button class="memory-button operator" data-action="memory-store">
              MS
            </button>
          </section>

          <section
            class="trig-keys"
            data-role="trig-section"
            aria-label="Calculator trigonometric keys"
          >
            <button class="memory-button operator" data-action="trig-sin">
              sin
            </button>
            <button class="memory-button operator" data-action="trig-cos">
              cos
            </button>
            <button class="memory-button operator" data-action="trig-tan">
              tan
            </button>
            <button
              class="memory-button operator mode-button"
              id="angle-mode-button"
              data-role="angle-mode"
              data-action="toggle-angle-mode"
            >
              DEG
            </button>
          </section>

          <section class="keys" aria-label="Calculator keys">
            <button class="danger" data-action="clear">AC</button>
            <button class="operator" data-action="backspace">⌫</button>
            <button class="operator" data-action="circle-area">A(r)</button>
            <button class="operator" data-action="percent">%</button>

            <button class="operator" data-value="/">÷</button>
            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>

            <button class="operator" data-value="*">×</button>
            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>

            <button class="operator" data-value="-">−</button>
            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>

            <button class="operator" data-value="+">+</button>
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equals" data-action="equals">=</button>
          </section>

          <p class="hint">
            Use the number keys, operators, memory keys, Enter, Backspace, Esc,
            and A. Trig functions use the selected angle mode.
          </p>
        </section>
      </section>
    </main>
  </body>
</html>
